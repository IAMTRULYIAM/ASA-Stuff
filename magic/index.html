<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spell Selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Texturina:ital,opsz,wght@0,12..72,100..900;1,12..72,100..900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#9A958A;
    --paper:#FBF6F3;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Texturina",Georgia,"Times New Roman",serif;
    font-size:17px;
    line-height:1.5;
    letter-spacing:-.012em;
    -webkit-font-smoothing:antialiased;
  }
  .frame{
    min-height:100%;
    max-width:720px;
    margin:0 auto;
    padding:56px 28px 40px;
    display:flex;
    flex-direction:column;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    opacity:.6;
    margin:0 0 40px;
  }
  h1{
    font-size:26px;
    font-weight:400;
    letter-spacing:-.02em;
    margin:0 0 32px;
  }
  main{flex:1 0 auto;}

  /* name field */
  input[type=text]{
    width:100%;
    letter-spacing:-.02em;
    background:transparent;
    border:0;
    border-bottom:1px solid var(--ink);
    color:var(--ink);
    font-family:inherit;
    font-size:26px;
    padding:6px 0;
    outline:none;
  }
  input[type=text]::placeholder{color:var(--ink);opacity:.32;}
  input[type=text]:focus{border-bottom-width:2px;}

  /* option lists */
  ul.list{list-style:none;margin:0;padding:0;}
  ul.list li{margin:0 0 2px;}
  .opt{
    width:100%;
    display:block;
    text-align:left;
    background:transparent;
    border:1px solid transparent;
    color:var(--ink);
    font:inherit;
    padding:13px 16px;
    cursor:pointer;
  }
  .opt:hover{border-color:var(--ink);}
  .opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .opt[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .opt[disabled]{opacity:.3;cursor:default;}
  .opt[disabled]:hover{border-color:transparent;}
  .opt .title{display:flex;justify-content:space-between;gap:18px;align-items:baseline;}
  .opt .title b{font-weight:400;}
  .opt .meta{
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    opacity:.6;
    white-space:nowrap;
  }
  .opt .body{font-size:14.5px;opacity:.72;margin-top:5px;max-width:60ch;}
  .opt[aria-pressed=true] .body,
  .opt[aria-pressed=true] .meta{opacity:.85;}
  .opt .fine{
    font-size:13px;
    margin-top:9px;
    padding-top:9px;
    border-top:1px solid var(--paper);
    opacity:.85;
  }
  .opt .fine span{display:block;}

  /* creatures */
  .beast{display:flex;gap:18px;align-items:flex-start;}
  .beast .art{
    flex:0 0 118px;
    width:118px;
    aspect-ratio:1/1;
    border:1px solid var(--ink);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    background:var(--paper);
  }
  .beast .art img{width:100%;height:100%;object-fit:contain;display:block;}
  .beast .art.wip{
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    text-align:center;
    opacity:.55;
    padding:8px;
    line-height:1.35;
  }
  .beast .col{flex:1;min-width:0;}
  .abil{margin-top:10px;font-size:14px;}
  .abil .head{
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    opacity:.6;
    margin-bottom:3px;
  }
  .opt[aria-pressed=true] .abil .head{opacity:.8;}
  .abil ul{list-style:none;margin:0;padding:0;}
  .abil li{padding:2px 0;opacity:.78;}
  .abil li b{font-weight:400;opacity:1;}
  .opt[aria-pressed=true] .abil li{opacity:.9;}
  @media (max-width:520px){
    .beast{flex-direction:column;}
    .beast .art{flex:none;width:100%;max-width:220px;}
  }

  /* review */
  dl{margin:0;}
  dl div{display:flex;gap:20px;padding:11px 0;border-bottom:1px solid var(--ink);}
  dl div:first-child{border-top:1px solid var(--ink);}
  dt{
    flex:0 0 132px;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    opacity:.6;
    padding-top:4px;
  }
  dd{margin:0;flex:1;}
  dd .sub{font-size:13px;opacity:.65;}

  /* footer nav */
  footer{
    flex:0 0 auto;
    margin-top:44px;
    display:flex;
    align-items:center;
    gap:18px;
  }
  .arrow{
    background:transparent;
    border:0;
    color:var(--ink);
    font-family:inherit;
    font-size:30px;
    line-height:1;
    padding:4px 10px;
    cursor:pointer;
  }
  .arrow:hover{background:var(--ink);color:var(--paper);}
  .arrow:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .arrow[disabled]{opacity:.22;cursor:default;background:transparent;color:var(--ink);}
  .status{
    flex:1;
    text-align:center;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    opacity:.6;
  }
  a{color:var(--ink);}
  .ref{
    display:inline-block;
    margin-top:26px;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    opacity:.6;
  }
  .ref:hover{opacity:1;}
  .note{font-size:13px;opacity:.65;margin-top:22px;max-width:56ch;}
  .code{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12px;
    white-space:pre-wrap;
    word-break:break-word;
    border:1px solid var(--ink);
    padding:12px;
    margin-top:14px;
    opacity:.8;
  }
  @media (max-width:560px){
    .frame{padding:34px 20px 28px;}
    dl div{flex-direction:column;gap:2px;}
    dt{flex:none;}
  }
  @media (prefers-reduced-motion:no-preference){
    main{animation:fade .22s ease-out;}
    @keyframes fade{from{opacity:0;}to{opacity:1;}}
  }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow" id="eyebrow">Spell Selection</p>
  <main id="main"></main>
  <footer>
    <button class="arrow" id="back" aria-label="Go back">&#8592;</button>
    <span class="status" id="status"></span>
    <button class="arrow" id="next" aria-label="Continue">&#8594;</button>
  </footer>
</div>

function stepList(){
  var out = ["name","equity","path","spells"];
  if (state.school === "OBEISANCE") out.push("creature");
  out.push("review","saved");
  return out;
}

var statusEl = document.getElementById("status");
var backEl = document.getElementById("back");
var nextEl = document.getElementById("next");

function isConservatory(){ return state.equity === "conservatory"; }

function activeSchools(){
  if (isConservatory()) return state.discipline ? DISCIPLINES[state.discipline].schools : [];
  return state.school ? [state.school] : [];
}

function pool(){
  var out = [];
  activeSchools().forEach(function(key){
    SCHOOLS[key].spells.forEach(function(sp){
      if (sp.l <= maxLevel()) out.push({ school:key, spell:sp });
    });
  });
  return out;
}

function maxLevel(){
  var eq = EQUITIES[state.equity];
  return (eq && eq.l2 > 0) ? 2 : 1;
}

function available(level){
  return pool().filter(function(p){ return p.spell.l === level; }).length;
}

function required(level){
  var eq = EQUITIES[state.equity];
  if (!eq) return 0;
  var want = level === 1 ? eq.l1 : eq.l2;
  return Math.min(want, available(level));
}

function chosen(level){
  return state.picks.filter(function(p){ return p.spell.l === level; }).length;
}

function pickKey(p){ return p.school + "/" + p.spell.n; }

function isPicked(p){
  return state.picks.some(function(x){ return pickKey(x) === pickKey(p); });
}

function togglePick(p){
  if (isPicked(p)){
    state.picks = state.picks.filter(function(x){ return pickKey(x) !== pickKey(p); });
  } else {
    if (chosen(p.spell.l) >= required(p.spell.l)) return;
    state.picks.push(p);
  }
  render();
}

function el(tag, attrs, kids){
  var node = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    if (k === "text") node.textContent = attrs[k];
    else if (k === "html") node.innerHTML = attrs[k];
    else if (k === "on") Object.keys(attrs.on).forEach(function(ev){ node.addEventListener(ev, attrs.on[ev]); });
    else if (attrs[k] !== null && attrs[k] !== false && attrs[k] !== undefined) node.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function(k){ node.appendChild(k); });
  return node;
}

function optionButton(opts){
  var btn = el("button", {
    "class":"opt",
    "type":"button",
    "aria-pressed": opts.selected ? "true" : "false",
    disabled: opts.disabled ? "disabled" : null,
    on:{ click: opts.onClick }
  });
  var title = el("div", { "class":"title" });
  title.appendChild(el("b", { text: opts.title }));
  if (opts.meta) title.appendChild(el("span", { "class":"meta", text: opts.meta }));
  btn.appendChild(title);
  if (opts.body) btn.appendChild(el("div", { "class":"body", text: opts.body }));
  if (opts.fine){
    var fine = el("div", { "class":"fine" });
    opts.fine.forEach(function(line){ fine.appendChild(el("span", { text: line })); });
    btn.appendChild(fine);
  }
  return btn;
}

function refLink(href, text){
  return el("a", { "class":"ref", href:href, target:"_blank", rel:"noopener", text:text });
}

/* screens */

function screenName(){
  var frag = document.createDocumentFragment();
  frag.appendChild(el("h1", { text:"Name" }));
  var input = el("input", { type:"text", id:"nameInput", value:state.name, placeholder:"Name", autocomplete:"off", spellcheck:"false" });
  input.addEventListener("input", function(){ state.name = input.value; updateNav(); });
  input.addEventListener("keydown", function(e){ if (e.key === "Enter") goNext(); });
  frag.appendChild(input);
  setTimeout(function(){ input.focus(); }, 0);
  return frag;
}

function screenEquity(){
  var frag = document.createDocumentFragment();
  frag.appendChild(el("h1", { text:"Magical equity" }));
  var list = el("ul", { "class":"list" });
  EQUITY_ORDER.forEach(function(key){
    var eq = EQUITIES[key];
    var li = el("li");
    li.appendChild(optionButton({
      title: eq.label,
      meta: eq.l2 ? "I \u00d7" + eq.l1 + "  II \u00d7" + eq.l2 : "I \u00d7" + eq.l1,
      body: eq.blurb,
      selected: state.equity === key,
      onClick: function(){
        if (state.equity !== key){
          state.equity = key;
          state.picks = [];
          if (key === "conservatory"){ state.school = null; state.creature = null; }
          else state.discipline = null;
        }
        render();
      }
    }));
    list.appendChild(li);
  });
  frag.appendChild(list);
  return frag;
}

function screenPath(){
  var frag = document.createDocumentFragment();
  if (isConservatory()){
    frag.appendChild(el("h1", { text:"Discipline" }));
    var dlist = el("ul", { "class":"list" });
    DISCIPLINE_ORDER.forEach(function(key){
      var d = DISCIPLINES[key];
      var li = el("li");
      li.appendChild(optionButton({
        title: d.label,
        meta: d.schools.map(function(s){ return SCHOOLS[s].label; }).join(" \u00b7 "),
        selected: state.discipline === key,
        onClick: function(){
          if (state.discipline !== key){ state.discipline = key; state.picks = []; }
          render();
        }
      }));
      dlist.appendChild(li);
    });
    frag.appendChild(dlist);
    frag.appendChild(refLink(LINK_DISCIPLINES, "Disciplines \u2197"));
    return frag;
  }

  frag.appendChild(el("h1", { text:"School of magic" }));
  var list = el("ul", { "class":"list" });
  SCHOOL_ORDER.forEach(function(key){
    var s = SCHOOLS[key];
    var first = s.spells.filter(function(x){ return x.l === 1; }).length;
    var thin = first < EQUITIES[state.equity].l1;
    var li = el("li");
    li.appendChild(optionButton({
      title: s.label,
      meta: thin ? "only " + first + " of order I" : null,
      selected: state.school === key,
      onClick: function(){
        if (state.school !== key){
          state.school = key;
          state.picks = [];
          state.creature = null;
        }
        render();
      }
    }));
    list.appendChild(li);
  });
  frag.appendChild(list);
  frag.appendChild(refLink(LINK_SCHOOLS, "Schools of magic \u2197"));
  return frag;
}

function screenSpells(){
  var frag = document.createDocumentFragment();
  frag.appendChild(el("h1", { text:"Starting spells" }));

  var list = el("ul", { "class":"list" });
  pool().forEach(function(p){
    var picked = isPicked(p);
    var full = !picked && chosen(p.spell.l) >= required(p.spell.l);
    var meta = ROMAN[p.spell.l] + "  \u00b7  " + p.spell.d;
    var li = el("li");
    li.appendChild(optionButton({
      title: p.spell.n,
      meta: (isConservatory() ? SCHOOLS[p.school].label + "  \u00b7  " : "") + meta,
      body: p.spell.t,
      fine: picked ? ["Effect: " + p.spell.e, "Miscast: " + p.spell.m] : null,
      selected: picked,
      disabled: full,
      onClick: function(){ togglePick(p); }
    }));
    list.appendChild(li);
  });
  frag.appendChild(list);
  return frag;
}

function screenCreature(){
  var frag = document.createDocumentFragment();
  frag.appendChild(el("h1", { text:"Starter creature" }));
  var list = el("ul", { "class":"list" });

  CREATURES.forEach(function(c){
    var selected = state.creature === c.key;
    var btn = el("button", {
      "class":"opt","type":"button",
      "aria-pressed": selected ? "true" : "false",
      on:{ click: function(){ state.creature = selected ? null : c.key; render(); } }
    });

    var row = el("div", { "class":"beast" });

    var art;
    if (c.img){
      art = el("div", { "class":"art" });
      art.appendChild(el("img", { src:c.img, alt:c.name, loading:"lazy" }));
    } else {
      art = el("div", { "class":"art wip", text:"Image in progress" });
    }
    row.appendChild(art);

    var col = el("div", { "class":"col" });
    var title = el("div", { "class":"title" });
    title.appendChild(el("b", { text:c.name }));
    col.appendChild(title);
    col.appendChild(el("div", { "class":"body", text:c.text }));

    var pa = el("div", { "class":"abil" });
    pa.appendChild(el("div", { "class":"head", text:"Passive" }));
    var pul = el("ul");
    var pli = el("li");
    pli.appendChild(el("b", { text:c.passive.n + ". " }));
    pli.appendChild(document.createTextNode(c.passive.d));
    pul.appendChild(pli);
    pa.appendChild(pul);
    col.appendChild(pa);

    var ma = el("div", { "class":"abil" });
    ma.appendChild(el("div", { "class":"head", text:"Moveset" }));
    var mul = el("ul");
    c.moves.forEach(function(m){
      var li = el("li");
      li.appendChild(el("b", { text:m.n + ". " }));
      li.appendChild(document.createTextNode(m.d));
      mul.appendChild(li);
    });
    ma.appendChild(mul);
    col.appendChild(ma);

    row.appendChild(col);
    btn.appendChild(row);

    var li2 = el("li");
    li2.appendChild(btn);
    list.appendChild(li2);
  });

  frag.appendChild(list);
  return frag;
}

function screenReview(){
  var frag = document.createDocumentFragment();
  frag.appendChild(el("h1", { text:"Review" }));

  var dl = el("dl");
  function row(label, value, sub){
    var d = el("div");
    d.appendChild(el("dt", { text: label }));
    var dd = el("dd", { text: value });
    if (sub) dd.appendChild(el("div", { "class":"sub", text: sub }));
    d.appendChild(dd);
    dl.appendChild(d);
  }
  row("Name", state.name);
  row("Equity", EQUITIES[state.equity].label);
  if (isConservatory()) row("Discipline", DISCIPLINES[state.discipline].label);
  row("Schools", activeSchools().map(function(s){ return SCHOOLS[s].label; }).join(", "));
  if (state.creature) row("Creature", creatureName(state.creature));
  state.picks.slice().sort(function(a,b){ return a.spell.l - b.spell.l; }).forEach(function(p, i){
    row("Spell " + (i+1), p.spell.n, ROMAN[p.spell.l] + "  \u00b7  " + SCHOOLS[p.school].label + "  \u00b7  " + p.spell.d);
  });
  frag.appendChild(dl);

  if (state.error){
    frag.appendChild(el("p", { "class":"note", text: state.error }));
    frag.appendChild(el("div", { "class":"code", text: JSON.stringify(payload(), null, 2) }));
  }
  return frag;
}

function screenSaved(){
  var frag = document.createDocumentFragment();
  frag.appendChild(el("h1", { text:"Filed" }));
  var dl = el("dl");
  var d = el("div");
  d.appendChild(el("dt", { text:"Reference" }));
  d.appendChild(el("dd", { text: state.saved }));
  dl.appendChild(d);
  frag.appendChild(dl);
  var again = el("a", { "class":"ref", href:"#", text:"Start again" });
  again.addEventListener("click", function(e){
    e.preventDefault();
    state = { name:"", equity:null, school:null, discipline:null, creature:null, picks:[], saved:null, error:null, sending:false };
    stepName = "name";
    render();
  });
  frag.appendChild(again);
  return frag;
}

/* navigation */

function canAdvance(){
  var s = stepName;
  if (s === "name") return state.name.trim().length > 0;
  if (s === "equity") return !!state.equity;
  if (s === "path") return isConservatory() ? !!state.discipline : !!state.school;
  if (s === "spells") return chosen(1) === required(1) && chosen(2) === required(2);
  if (s === "creature") return !!state.creature;
  if (s === "review") return !state.sending;
  return false;
}

function statusText(){
  var s = stepName;
  if (s === "spells"){
    var parts = [];
    parts.push("I " + chosen(1) + "/" + required(1));
    if (required(2)) parts.push("II " + chosen(2) + "/" + required(2));
    return parts.join("   ");
  }
  if (s === "creature") return state.creature ? creatureName(state.creature) : "";
  if (s === "review" && state.sending) return "Filing";
  return "";
}

function creatureName(key){
  var found = null;
  CREATURES.forEach(function(c){ if (c.key === key) found = c.name; });
  return found;
}

function payload(){
  return {
    name: state.name.trim(),
    equity: state.equity,
    equityLabel: EQUITIES[state.equity].label,
    discipline: isConservatory() ? DISCIPLINES[state.discipline].label : null,
    creature: state.creature ? creatureName(state.creature) : null,
    schools: activeSchools().map(function(s){ return SCHOOLS[s].label; }),
    spells: state.picks.map(function(p){
      return { school: SCHOOLS[p.school].label, name: p.spell.n, level: p.spell.l };
    })
  };
}

function submit(){
  state.sending = true;
  state.error = null;
  render();
  fetch("/api/characters", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload())
  }).then(function(res){
    return res.json().then(function(data){ return { ok: res.ok, data: data }; });
  }).then(function(r){
    state.sending = false;
    if (r.ok && r.data && r.data.ok){
      state.saved = r.data.id;
      stepName = "saved";
    } else {
      state.error = (r.data && r.data.error) ? r.data.error : "The register did not accept the record.";
    }
    render();
  }).catch(function(){
    state.sending = false;
    state.error = "The register could not be reached.";
    render();
  });
}

function goNext(){
  if (!canAdvance()) return;
  if (stepName === "review"){ submit(); return; }
  var list = stepList();
  var i = list.indexOf(stepName);
  stepName = list[Math.min(i + 1, list.length - 1)];
  render();
}

function goBack(){
  var list = stepList();
  var i = list.indexOf(stepName);
  if (i <= 0 || stepName === "saved") return;
  stepName = list[i - 1];
  render();
}

function updateNav(){
  var list = stepList();
  nextEl.disabled = !canAdvance();
  backEl.disabled = list.indexOf(stepName) <= 0 || stepName === "saved";
  statusEl.textContent = statusText();
}

function render(){
  if (stepList().indexOf(stepName) === -1) stepName = "spells";
  var s = stepName;
  mainEl.innerHTML = "";
  if (s === "name") mainEl.appendChild(screenName());
  else if (s === "equity") mainEl.appendChild(screenEquity());
  else if (s === "path") mainEl.appendChild(screenPath());
  else if (s === "spells") mainEl.appendChild(screenSpells());
  else if (s === "creature") mainEl.appendChild(screenCreature());
  else if (s === "review") mainEl.appendChild(screenReview());
  else mainEl.appendChild(screenSaved());
  eyebrowEl.textContent = state.name.trim() ? state.name.trim() : "Spell Selection";
  updateNav();
  window.scrollTo(0, 0);
}

backEl.addEventListener("click", goBack);
nextEl.addEventListener("click", goNext);
document.addEventListener("keydown", function(e){
  if (e.target && e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") goNext();
  if (e.key === "ArrowLeft") goBack();
});

render();
</script>
</body>
</html>
