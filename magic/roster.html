<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Texturina:ital,opsz,wght@0,12..72,100..900;1,12..72,100..900&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#9A958A; --paper:#FBF6F3; }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Texturina",Georgia,"Times New Roman",serif;
    font-size:17px;line-height:1.55;
  }
  .frame{max-width:820px;margin:0 auto;padding:56px 28px 60px;}
  .eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;opacity:.6;margin:0 0 40px;}
  h1{font-size:26px;font-weight:400;margin:0 0 32px;}
  .entry{border-top:1px solid var(--ink);padding:16px 0;}
  .entry:last-child{border-bottom:1px solid var(--ink);}
  .head{display:flex;justify-content:space-between;gap:18px;align-items:baseline;}
  .who{font-size:20px;}
  .meta{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.6;white-space:nowrap;}
  .line{font-size:14.5px;opacity:.75;margin-top:6px;}
  .spells{margin:8px 0 0;padding:0;list-style:none;font-size:14.5px;}
  .spells li{padding:2px 0;}
  .spells .ord{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.6;margin-left:8px;}
  .bar{display:flex;gap:14px;align-items:center;margin-bottom:30px;}
  button, input[type=text]{
    background:transparent;border:1px solid var(--ink);color:var(--ink);
    font:inherit;font-size:14px;padding:7px 12px;cursor:pointer;
  }
  input[type=text]{cursor:text;flex:1;min-width:0;}
  input[type=text]::placeholder{color:var(--ink);opacity:.4;}
  button:hover{background:var(--ink);color:var(--paper);}
  input:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .empty{opacity:.6;padding:26px 0;border-top:1px solid var(--ink);}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Register</p>
  <h1>Filed characters</h1>
  <div class="bar">
    <input type="text" id="q" placeholder="Filter by name, school or spell" autocomplete="off">
    <button id="reload" type="button">Reload</button>
    <button id="csv" type="button">Download CSV</button>
  </div>
  <div id="out"></div>
</div>
<script>
"use strict";
var ROMAN = { 1:"I", 2:"II", 3:"III" };
var records = [];
var out = document.getElementById("out");
var q = document.getElementById("q");

function esc(s){ return String(s == null ? "" : s); }

function draw(){
  var term = q.value.trim().toLowerCase();
  var shown = records.filter(function(r){
    if (!term) return true;
    var hay = [r.name, r.equityLabel, r.discipline, (r.schools||[]).join(" "),
      (r.spells||[]).map(function(s){ return s.name; }).join(" ")].join(" ").toLowerCase();
    return hay.indexOf(term) !== -1;
  });
  out.innerHTML = "";
  if (!shown.length){
    var e = document.createElement("div");
    e.className = "empty";
    e.textContent = records.length ? "Nothing matches that filter." : "The register is empty.";
    out.appendChild(e);
    return;
  }
  shown.forEach(function(r){
    var box = document.createElement("div");
    box.className = "entry";

    var head = document.createElement("div");
    head.className = "head";
    var who = document.createElement("div");
    who.className = "who";
    who.textContent = esc(r.name);
    var meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = (r.created || "").slice(0, 10) + "  \u00b7  " + esc(r.id);
    head.appendChild(who); head.appendChild(meta);
    box.appendChild(head);

    var line = document.createElement("div");
    line.className = "line";
    var bits = [esc(r.equityLabel)];
    if (r.discipline) bits.push(esc(r.discipline));
    bits.push((r.schools || []).join(", "));
    line.textContent = bits.filter(Boolean).join("  \u00b7  ");
    box.appendChild(line);

    var ul = document.createElement("ul");
    ul.className = "spells";
    (r.spells || []).slice().sort(function(a,b){ return a.level - b.level; }).forEach(function(s){
      var li = document.createElement("li");
      li.textContent = esc(s.name);
      var ord = document.createElement("span");
      ord.className = "ord";
      ord.textContent = (ROMAN[s.level] || s.level) + "  \u00b7  " + esc(s.school);
      li.appendChild(ord);
      ul.appendChild(li);
    });
    box.appendChild(ul);
    out.appendChild(box);
  });
}

function load(){
  out.innerHTML = "";
  var e = document.createElement("div");
  e.className = "empty";
  e.textContent = "Loading.";
  out.appendChild(e);
  fetch("/api/characters").then(function(r){ return r.json(); }).then(function(d){
    if (!d.ok) throw new Error(d.error || "unavailable");
    records = d.records || [];
    draw();
  }).catch(function(err){
    out.innerHTML = "";
    var f = document.createElement("div");
    f.className = "empty";
    f.textContent = "Could not read the register. " + err.message;
    out.appendChild(f);
  });
}

function csv(){
  var rows = [["name","equity","discipline","schools","spell","order","spell school","filed","id"]];
  records.forEach(function(r){
    (r.spells || []).forEach(function(s){
      rows.push([r.name, r.equityLabel, r.discipline || "", (r.schools||[]).join(" / "),
        s.name, ROMAN[s.level] || s.level, s.school, r.created, r.id]);
    });
  });
  var text = rows.map(function(row){
    return row.map(function(c){ return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(",");
  }).join("\n");
  var url = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
  var a = document.createElement("a");
  a.href = url; a.download = "register.csv"; a.click();
  URL.revokeObjectURL(url);
}

q.addEventListener("input", draw);
document.getElementById("reload").addEventListener("click", load);
document.getElementById("csv").addEventListener("click", csv);
load();
</script>
</body>
</html>
